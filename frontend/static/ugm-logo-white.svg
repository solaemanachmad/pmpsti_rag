<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" fill="none">
  <g transform="translate(210,210)">
    <!-- === 8 kelopak luar (teratai) === -->
    <!-- Top -->
    <path d="M0,-190 C-28,-172 -52,-138 -50,-100 Q-28,-70 0,-62 Q28,-70 50,-100 C52,-138 28,-172 0,-190Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Bottom -->
    <path d="M0,190 C-28,172 -52,138 -50,100 Q-28,70 0,62 Q28,70 50,100 C52,138 28,172 0,190Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Left -->
    <path d="M-190,0 C-172,-28 -138,-52 -100,-50 Q-70,-28 -62,0 Q-70,28 -100,50 C-138,52 -172,28 -190,0Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Right -->
    <path d="M190,0 C172,-28 138,-52 100,-50 Q70,-28 62,0 Q70,28 100,50 C138,52 172,28 190,0Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Top-right -->
    <path d="M134,-134 C108,-142 76,-128 64,-100 Q66,-74 84,-60 Q110,-58 130,-72 C148,-96 146,-122 134,-134Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Top-left -->
    <path d="M-134,-134 C-108,-142 -76,-128 -64,-100 Q-66,-74 -84,-60 Q-110,-58 -130,-72 C-148,-96 -146,-122 -134,-134Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Bottom-right -->
    <path d="M134,134 C108,142 76,128 64,100 Q66,74 84,60 Q110,58 130,72 C148,96 146,122 134,134Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Bottom-left -->
    <path d="M-134,134 C-108,142 -76,128 -64,100 Q-66,74 -84,60 Q-110,58 -130,72 C-148,96 -146,122 -134,134Z"
          fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round"/>

    <!-- === Sinar surya (rays) dari lingkaran tengah === -->
    <g stroke="white" stroke-width="2">
      <!-- 8 arah utama -->
      <line x1="0" y1="-62" x2="0" y2="-115"/>
      <line x1="44" y1="-44" x2="81" y2="-81"/>
      <line x1="62" y1="0" x2="115" y2="0"/>
      <line x1="44" y1="44" x2="81" y2="81"/>
      <line x1="0" y1="62" x2="0" y2="115"/>
      <line x1="-44" y1="44" x2="-81" y2="81"/>
      <line x1="-62" y1="0" x2="-115" y2="0"/>
      <line x1="-44" y1="-44" x2="-81" y2="-81"/>
      <!-- 8 arah antara — pendek -->
      <line x1="24" y1="-58" x2="44" y2="-106"/>
      <line x1="58" y1="-24" x2="106" y2="-44"/>
      <line x1="58" y1="24" x2="106" y2="44"/>
      <line x1="24" y1="58" x2="44" y2="106"/>
      <line x1="-24" y1="58" x2="-44" y2="106"/>
      <line x1="-58" y1="24" x2="-106" y2="44"/>
      <line x1="-58" y1="-24" x2="-106" y2="-44"/>
      <line x1="-24" y1="-58" x2="-44" y2="-106"/>
    </g>

    <!-- === Lingkaran konsentris === -->
    <circle cx="0" cy="0" r="118" fill="none" stroke="white" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="white" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="0" cy="0" r="7" fill="white"/>

    <!-- === Teks arc UNIVERSITAS (atas) === -->
    <defs>
      <path id="uarc" d="M -46,0 A 46,46 0 0,1 46,0"/>
      <path id="jarc" d="M -42,8 A 46,46 0 0,0 42,8"/>
    </defs>
    <text font-family="serif" font-size="8.5" fill="white" letter-spacing="1.5">
      <textPath href="#uarc" startOffset="8%">UNIVERSITAS</textPath>
    </text>
    <text font-family="serif" font-size="8.5" fill="white" letter-spacing="1.5">
      <textPath href="#jarc" startOffset="10%">JOGJAKARTA</textPath>
    </text>

    <!-- Aksara DJAH -->
    <text x="0" y="4" text-anchor="middle" font-family="serif" font-size="8" font-weight="bold"
          fill="white" letter-spacing="2">DJAH</text>
  </g>

  <!-- Wordmark -->
  <text x="210" y="390" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-weight="400" fill="white" letter-spacing="4">UNIVERSITAS</text>
  <text x="210" y="428" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-weight="400" fill="white" letter-spacing="2.5">GADJAH MADA</text>
</svg>
